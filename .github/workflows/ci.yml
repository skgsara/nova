# CI — build and run every suite that does not need an off-air recording.
#
# READ THIS BEFORE TRUSTING A GREEN TICK. On a public runner Nova has no
# recordings: 30 of its 40 suites skip, and ctest still exits 0 and prints
# "100% tests passed". A green run here means the 10 fixture-independent
# suites passed — the synthetic {IOC 288,576} x {60,90,120} matrix, the
# tone detector, the untrusted-input guards, the ruler mapping, the PNG
# round-trip, the audio ring, the hooks, the GUI layout, the tuning
# spectrum and the version flag. It does NOT mean the real-signal
# regression ran. That is
# `release.yml` plus `tools/record-fixture-regression.sh`, and it is
# deliberately a human with the recordings.
#
# The `inventory` step is what keeps that distinction honest: it fails if
# the number of registered or skipped suites moves, so a suite that
# quietly stops existing cannot pass as a smaller green run.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 is the only platform Nova has ever been built on
          # (README, Platforms). Linux x86-64 is here to find out, not
          # because anything is claimed about it — a failure on this row
          # is a finding, and the README must not be updated to claim the
          # platform until this row has actually been seen green.
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install FLTK and RtAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xvfb curl \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxfixes-dev libxrender-dev \
            libjpeg-dev libpng-dev zlib1g-dev \
            libasound2-dev libpulse-dev
          # Ubuntu's libfltk1.3-dev and librtaudio-dev are the WRONG
          # MAJORS: the shell is written against FLTK 1.4
          # (Fl_RGB_Image::scale) and RtAudio 6 (RtAudioErrorType,
          # getDeviceIds, DeviceInfo::ID). Build the exact versions the
          # macOS row gets from Homebrew, so both rows exercise one API
          # surface rather than two.
          curl -sL https://github.com/fltk/fltk/archive/refs/tags/release-1.4.5.tar.gz | tar xz
          cmake -B fltk-build -S fltk-release-1.4.5 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_GL=OFF
          cmake --build fltk-build --parallel
          sudo cmake --install fltk-build
          curl -sL https://github.com/thestk/rtaudio/archive/refs/tags/6.0.1.tar.gz | tar xz
          cmake -B rtaudio-build -S rtaudio-6.0.1 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DRTAUDIO_API_ALSA=ON -DRTAUDIO_API_PULSE=ON \
            -DRTAUDIO_API_JACK=OFF -DRTAUDIO_API_OSS=OFF
          cmake --build rtaudio-build --parallel
          sudo cmake --install rtaudio-build

      - name: Install FLTK and RtAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install fltk rtaudio

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # The GUI is optional by design and skips silently when its two
      # dependencies are missing. On a runner where we just installed
      # them, a silent skip would quietly drop gui_layout and gui_shell
      # from the inventory — so require the target to exist.
      - name: Require the GUI target to have been built
        run: cmake --build build --target nova-gui

      - name: Build
        run: cmake --build build --parallel

      - name: Suites (10 run, 30 skipped without recordings)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a tools/check-suite-inventory.sh build 40 30
          else
            tools/check-suite-inventory.sh build 40 30
          fi

      # -Wall -Wextra are on for every target; the project has been warning
      # free since session 34 and says so in the changelog, so a new warning
      # is a regression against a written claim.
      - name: No warnings
        run: |
          rm -rf build-warnings
          cmake -B build-warnings -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-warnings --parallel 2>&1 | tee warn.log
          if grep -E "warning:" warn.log; then
            echo "::error::the tree is meant to build warning free"
            exit 1
          fi

  # The dependency-free path. nova-core and nova-live are claimed to need
  # no FLTK, no RtAudio and no window; this job is what makes that claim
  # falsifiable rather than merely stated (C-GAP-003, session 34).
  no-gui:
    name: ${{ matrix.label }} (NOVA_BUILD_GUI=OFF)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Configure without the GUI
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Suites (9 run, 29 skipped)
        run: tools/check-suite-inventory.sh build 38 29

  # M5 tier 1: the release binary for the Mac is universal2. Homebrew's
  # FLTK and RtAudio are single-architecture, so both are built from
  # source as universal here — the same pinned versions the other rows
  # use — and the row proves the tree builds AND passes as
  # arm64;x86_64, not merely on the runner's own slice.
  macos-universal:
    name: macos-universal2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FLTK 1.4.5 and RtAudio 6.0.1 as universal2
        run: |
          curl -sL https://github.com/fltk/fltk/archive/refs/tags/release-1.4.5.tar.gz | tar xz
          cmake -B fltk-build -S fltk-release-1.4.5 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/nova-deps" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF
          cmake --build fltk-build --parallel
          cmake --install fltk-build
          curl -sL https://github.com/thestk/rtaudio/archive/refs/tags/6.0.1.tar.gz | tar xz
          cmake -B rtaudio-build -S rtaudio-6.0.1 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/nova-deps" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DRTAUDIO_API_CORE=ON
          cmake --build rtaudio-build --parallel
          cmake --install rtaudio-build
      - name: Configure and build universal
        run: |
          export PATH="$HOME/nova-deps/bin:$PATH"
          export PKG_CONFIG_PATH="$HOME/nova-deps/lib/pkgconfig"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --parallel
      - name: Every binary carries both architectures
        run: |
          for b in nova-decode nova-gen nova-tones nova-preview nova-gui; do
            file "build/$b"
            file "build/$b" | grep -q x86_64 || {
              echo "::error::$b is not universal"; exit 1; }
          done
      - name: Suites (10 run, 30 skipped without recordings)
        run: tools/check-suite-inventory.sh build 40 30

  # M5 tier 1: Windows Win64, MSVC (the default Visual Studio generator on
  # windows-latest — multi-config, so every build/test step names the
  # Release configuration, and the inventory script gets it as its
  # optional fourth argument — ctest does NOT read CTEST_CONFIGURATION_TYPE
  # here, measured on the runner, which cost a run of "Missing -C"). The runner has
  # neither fltk-config nor pkg-config, so FLTK and RtAudio are built from
  # source at the same pinned versions the other rows use and found through
  # their CMake config packages — the fallback the NOVA_BUILD_GUI block
  # grew for exactly this row. RtAudio is static (nothing to ship beside
  # the binary) and told to keep the shared CRT: its default for a static
  # MSVC build is /MT, which would not match the rest of the tree.
  # There is deliberately no "No warnings" step here: the project's
  # warning-free standard is stated for -Wall -Wextra, which are GCC/Clang
  # spellings; MSVC runs at /W3 and is not gated on warnings.
  windows-msvc:
    name: windows-x86_64 (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build FLTK 1.4.5 and RtAudio 6.0.1 from source
        run: |
          set -e
          deps="$PWD/nova-deps"
          curl -sL https://github.com/fltk/fltk/archive/refs/tags/release-1.4.5.tar.gz | tar xz
          cmake -B fltk-build -S fltk-release-1.4.5 \
            -DCMAKE_INSTALL_PREFIX="$deps" \
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_GL=OFF
          cmake --build fltk-build --config Release --parallel
          cmake --install fltk-build --config Release
          curl -sL https://github.com/thestk/rtaudio/archive/refs/tags/6.0.1.tar.gz | tar xz
          cmake -B rtaudio-build -S rtaudio-6.0.1 \
            -DCMAKE_INSTALL_PREFIX="$deps" \
            -DBUILD_SHARED_LIBS=OFF -DRTAUDIO_STATIC_MSVCRT=OFF
          cmake --build rtaudio-build --config Release --parallel
          cmake --install rtaudio-build --config Release
      - name: Configure
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="$PWD/nova-deps"
      - name: Require the GUI target to have been built
        run: cmake --build build --config Release --target nova-gui
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Suites (10 run, 30 skipped without recordings)
        run: tools/check-suite-inventory.sh build 40 30 Release
